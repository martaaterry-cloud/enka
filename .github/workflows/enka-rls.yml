name: Enka RLS (isolated PostgreSQL)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enka-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: enka-test-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Enka user isolation without production credentials
        env:
          ENKA_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/runEnkaRls.sh
